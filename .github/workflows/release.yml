name: deploy production

on:
  push:
    tags:
      - v*.*.*

concurrency:
  group: goreleaser
  cancel-in-progress: true

jobs:
  goreleaser:
    uses: charmbracelet/meta/.github/workflows/goreleaser.yml@main
    with:
      go_version: stable
    secrets:
      docker_username: ${{ secrets.DOCKERHUB_USERNAME }}
      docker_token: ${{ secrets.DOCKERHUB_TOKEN }}
      goreleaser_key: ${{ secrets.GORELEASER_KEY }}
      gh_pat: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  deploy:
    name: Run deploy workflow
    runs-on: ubuntu-latest
    needs: [goreleaser]
    steps:
      - uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Update
          repo: charmbracelet/infra-prod
          ref: main
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          inputs: |
            {
              "app": "catwalk",
              "image": "ghcr.io/charmbracelet/catwalk:${{ github.ref_name }}"
            }

  deploy-cloud-run:
    name: Deploy to Cloud Run (prod)
    runs-on: ubuntu-latest
    needs: [goreleaser]
    permissions:
      id-token: write # for GCP Workload Identity Federation
      contents: read
      packages: read # pull the release image from ghcr
    steps:
      - name: notify deploy started
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_DEPLOY_BOT_TOKEN }}
          TEXT: >-
            :rocket: catwalk prod deploy started —
            `${{ github.ref_name }}`
            by ${{ github.actor }}
            (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>)
        run: |
          jq -n --arg channel "#catwalk-deploy-prod" --arg text "$TEXT" \
            '{channel: $channel, text: $text}' \
          | curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json" -d @-
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        name: gcp auth
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        name: setup gcloud
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        name: setup crane
      - name: copy image ghcr -> prod artifact registry
        run: |
          crane auth login ghcr.io -u ${{ github.actor }} --password-stdin \
            <<< "${{ secrets.GITHUB_TOKEN }}"
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          crane copy \
            ghcr.io/charmbracelet/catwalk:${{ github.ref_name }} \
            us-east1-docker.pkg.dev/infra-415616/charm/catwalk:${{ github.ref_name }}
      - name: deploy to cloud run
        run: |
          gcloud run deploy catwalk \
            --project=infra-415616 \
            --region=us-east1 \
            --image=us-east1-docker.pkg.dev/infra-415616/charm/catwalk:${{ github.ref_name }} \
            --quiet
      - name: verify
        run: |
          sleep 10
          for host in catwalk.charm.sh catwalk.charm.land; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/health")
            [ "$code" = "200" ] || { echo "$host health=$code"; exit 1; }
            echo "$host health=200"
          done

  notify:
    name: Notify deploy result
    runs-on: ubuntu-latest
    needs: [goreleaser, deploy, deploy-cloud-run]
    if: always()
    steps:
      - name: notify deploy result
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_DEPLOY_BOT_TOKEN }}
          BUILD_RESULT: ${{ needs.goreleaser.result }}
          GKE_RESULT: ${{ needs.deploy.result }}
          CLOUD_RUN_RESULT: ${{ needs.deploy-cloud-run.result }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$CLOUD_RUN_RESULT" = "success" ]; then
            TEXT=":white_check_mark: catwalk prod deploy succeeded — \`$REF_NAME\`, healthy on both hosts (<$RUN_URL|run>)"
            if [ "$GKE_RESULT" != "success" ]; then
              TEXT="$TEXT — note: legacy GKE dispatch: $GKE_RESULT"
            fi
          else
            TEXT=":x: catwalk prod deploy FAILED — \`$REF_NAME\` (build: $BUILD_RESULT, cloud run: $CLOUD_RUN_RESULT, gke dispatch: $GKE_RESULT) (<$RUN_URL|run>)"
          fi
          jq -n --arg channel "#catwalk-deploy-prod" --arg text "$TEXT" \
            '{channel: $channel, text: $text}' \
          | curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json" -d @-
